<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus - Portal do Conhecimento</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: #16162a;
            color: #e0e0e0;
            padding: 32px 48px;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,224,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,224,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        header, main, footer { position: relative; z-index: 1; }

        .top-nav {
            position: relative;
            z-index: 10;
            padding: 0 0 24px 0;
        }
        .top-nav a {
            display: inline-block;
            background: rgba(0,224,255,0.08);
            border: 1px solid rgba(0,224,255,0.25);
            color: #00e0ff;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: bold;
            font-family: 'Roboto Mono', monospace;
            padding: 8px 12px;
            border-radius: 8px;
            letter-spacing: 1px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .top-nav a:hover {
            background: rgba(0,224,255,0.15);
            box-shadow: 0 4px 12px rgba(0,224,255,0.2);
        }

        header, main, footer { position: relative; z-index: 1; }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #00e0ff;
            font-size: 2.4rem;
            margin-bottom: 8px;
            text-shadow: 0 0 8px #00e0ff;
        }

        p.lead {
            color: #a0a0a0;
            margin-bottom: 25px;
        }

        hr {
            margin: 36px auto;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,224,255,0.3), transparent);
            width: 60%;
        }

        main {
            max-width: 1200px;
            margin: auto;
        }

        .filter-card {
            background: #13132a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        #search {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid rgba(0, 224, 255, 0.12);
            background: #0f1724;
            color: #00e0ff;
            font-size: 1rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-select {
            padding: 10px 12px;
            background: #0f1724;
            color: #00e0ff;
            border: 1px solid rgba(0, 224, 255, 0.12);
            border-radius: 6px;
            font-size: 1rem;
        }

        section {
            margin-bottom: 40px;
            padding: 20px;
            background: #13132a;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        h2 {
            color: #00e0ff;
            font-size: 1.5rem;
            margin-bottom: 18px;
        }

        .scripts {
            display: flex;
            gap: 20px;
        }

        .scripts-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .script-item {
            padding: 16px;
            border-left: 3px solid rgba(0, 224, 255, 0.35);
            background: #1a1a30;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .script-title {
            font-size: 1.05rem;
            color: #cfeff6;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .tag {
            display: inline-block;
            padding: 2px 6px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .tag-consulta {
            background: rgba(0, 224, 255, 0.15);
            color: #00e0ff;
        }

        .tag-alteracao {
            background: rgba(255, 210, 0, 0.18);
            color: #ffe46b;
        }

        .tag-delete {
            background: rgba(255, 80, 80, 0.20);
            color: #ff7b7b;
        }

        .tag-banco {
            background: rgba(120, 255, 120, 0.18);
            color: #7fff7f;
        }

        .tag-relatorio {
           background: rgba(155, 89, 255, 0.18);
            color: #caa6ff;
        }

        .tag-implantacao {
            background: rgba(0, 255, 170, 0.18);
            color: #00ffbf;
        }

        .tag-novo {
            display: inline-block;
            background: #00e0ff;
            color: #0f0f1d;
            padding: 3px 8px;
            margin-left: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            animation: pulseNew 1.6s infinite ease-in-out;
        }

        @keyframes pulseNew {
            0% {
                transform: scale(1);
                box-shadow: 0 0 6px #00e0ff;
            }

            50% {
                transform: scale(1.15);
                box-shadow: 0 0 14px #00e0ff;
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 6px #00e0ff;
            }
        }

        .inline-code {
            background: #1c1c2e;
            padding: 3px 6px;
            border-radius: 6px;
            color: #00ffff;
            font-size: 0.9rem;
        }

        .toggle-desc {
            cursor: pointer;
            color: #00e0ff;
            font-size: 0.85rem;
            margin-top: 6px;
            display: inline-block;
        }

        .description-box {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-left: 3px solid #00e0ff44;
            border-radius: 8px;
            color: #b9ffff;
            font-size: 0.9rem;
            display: none;
        }

        .copy-btn {
            background: linear-gradient(45deg, #00e0ff, #0055ff);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(0, 224, 255, 0.18);
        }

        .copy-btn:hover {
            background-color: #00b3cc;
        }

.filters-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.form-btn {
    position: relative;
    padding: 8px 18px;
    border-radius: 10px;
    border: 1px solid rgba(0, 255, 255, 0.4);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;

    color: #0f0f1d;

    background: linear-gradient(
        120deg,
        #00f5ff,
        #00ffb3,
        #00e0ff
    );
    background-size: 200% 200%;
    animation: gradientFlow 5s ease infinite;

    box-shadow:
        0 0 8px rgba(0, 255, 255, 0.4);

    transition: all 0.3s ease;
}

.form-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 0 14px #00f5ff,
        0 0 25px rgba(0, 255, 200, 0.6);
}

.form-btn:active {
    transform: scale(0.97);
}

@keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}
main { animation: fadeUp 0.5s ease both; }

    </style>
</head>

    <script>

        const scripts = [
            { system: "folha", type: "consulta", title: "Consulta Valor de Base por Matrícula e Competência", key: "7556ea5b-86c2-406d-b213-14cdd8b4fd6d", date: "2026-09-03", description: "Consulta Valor de Base por Matrícula e Competência" },
            { system: "folha", type: "alteracao", title: "Datas de início e fim do período aquisitivo - (datas + movimentação)", key: "8ff59ff5-6ac1-4cb4-9166-b9abd34b2a05", date: "2026-08-21", description: "Altera dataInicial/dataFinal de um periodo aquisitivo. Se o periodo estiver CANCELADO e sem movimentacao de cancelamento registrada (dado historico incompleto), reconstroi a movimentacao antes de salvar - evita o erro  \"Não é possível salvar um periodo cancelado sem movimentação de cancelamento\"." },
            { system: "folha", type: "alteracao", title: "Auditoria de Vagas Ocupadas x Matriculas Reais - Cargo", key: "25596fec-bbae-44ea-86ee-4847fedd031f", date: "2026-08-17", description: "O contador de vagas ocupadas do cargo conta as matriculas ativas (cargo efetivo ou comissionado) com ocupaVaga=true. Este script liga a flag em quem esta ativo e sem ela." },
            { system: "folha", type: "relatorio", title: "Comparativo Folha Mensal x Folha Férias (eventos x réplicas)", date: "2026-08-11", fonte: "5bdd9cf3-d895-417e-8b2a-c14316221cce", relatorio: "160f59a4-5662-4522-9414-10520bb45fd9", description: "Realiza o comparativo entre os eventos calculados na folha de férias x réplicas destes na folha mensal (aponta divergências ou conformidade nos eventos)" },
            { system: "folha", type: "consulta", title: "Auditoria de Vagas Ocupadas x Matriculas Reais - Cargo", key: "65857b53-0338-4b9d-8f21-948ebdc76159", date: "2026-08-17", description: "Cruza o contador vagas ocupadas do cadastro de cargos contra a contagem real de matriculas ativas. Marca cargos extintos e sinaliza extintos que ainda possuem ocupantes. Divergencias primeiro; resumo ao final do CSV." },
            { system: "folha", type: "alteracao", title: "Troca eventos replicados na mensal (evento x por evento y)", key: "29bbf440-2f56-4827-bc68-750f83a4f210", date: "2026-08-06", description: "Realiza a troca de um evento por outro, trocando apenas eventos que estão replicados na folha mensal." },
            { system: "folha", type: "consulta", title: "Consulta de Cargos por Ato Administrativo", key: "f115f5a8-f126-45a1-9e01-738b15e41d34", date: "2026-08-05", description: "Lista todos os cargos que possuem o ato administrativo informado (busca parcial no número ou descrição do ato)." },
            { system: "folha", type: "consulta", title: "Aniversários de Serviço por Triênio (28/05/2020 a 31/12/2021)", key: "4a5c401b-85d4-4fc7-8600-e7b6b0f02e34", date: "2026-08-04", description: "Lista servidores que completaram múltiplos de 3 anos de serviço entre 28/05/2020 e 31/12/2021, com número de triênios correspondente." },
            { system: "folha", type: "relatorio", title: "Relatório de Custo de Funcionários", date: "2026-07-30", fonte: "02605e2f-a94d-4aa6-af25-a6387aeb45e7", relatorio: "b944797f-be86-43ee-a632-bd9ddb9e2da8", description: "Relatório que apresenta, por servidor, o salário bruto, o valor do FGTS, os encargos patronais (INSS ou Fundo Próprio, conforme o regime previdenciário do servidor), o custo total, os descontos e o salário líquido de uma competência específica, com dados consolidados dos relatórios de Encargos INSS-FGTS e Previdência Própria. Permite agrupamento por organograma, secretaria ou grupo funcional." },
            { system: "folha", type: "consulta", title: "Eventos com valorReferencia negativo - por Competência", key: "bd9150ea-8a7b-4565-8968-85e41f0deb84", date: "2026-07-30", description: "Verifica todas as folhas calculadas da competência informada e lista os eventos cujo valorReferencia menor que zero. Gera CSV." },
            { system: "esocial", type: "delete", title: "Exclusão de domínios duplicados - eSocial", key: "edd60b99-bb7a-4ddd-9e81-073cbb7ba04f", date: "2026-07-20", description: "Script que localiza e remove históricos de domínio eSocial duplicados: para cada domínio, mantém a versão que já tem recibo de envio e exclui as versões extras que ficaram \"Sem erro / Pendente\" sem recibo (duplicatas geradas indevidamente). Alertas de uso: Sempre rodar primeiro com modo Teste = true e conferir o log antes de excluir de verdade. Exclusão é técnica e irreversível. Nunca apaga o domínio/servidor, só históricos redundantes — sempre sobra pelo menos 1 versão. Mensagem de \"Authorization expirado\" pode, na real, ser só \"nenhum domínio bateu com o filtro\" — checar período/domínio antes de recapturar token."},
            { system: "folha", type: "alteracao", title: "Alterar Vínculo Empregatício em Todos os Históricos da Matrícula", key: "38001164-dfba-4a6f-9cb2-f1a1357701e8", date: "2026-07-17", description: "Percorre todos os históricos de uma matrícula e altera o vinculo Empregatício para um novo ID. Modos REVISAR/ALTERAR." },
            { system: "folha", type: "consulta", title: "Listagem de eventos retornam valor de um outro evento", key: "08cc158a-d79b-4bc7-903c-9a541537a419", date: "2026-07-09", description: "Gera uma listagem CSV com os eventos que possuem dependência direta com outros eventos. Utiliza-se a chamada de função Eventos.valor()" },
            { system: "folha", type: "relatorio", title: "Relatório da Tela de Matrículas", date: "2026-07-08", fonte: "473e0050-1167-4517-be61-39aac1eff65c", relatorio: "31c2a4fc-c88f-4e86-8155-49b8c3c80bfb", description: "O relatório foi desenvolvido para facilitar a consulta dos dados da tela de Histórico de Matrículas, principalmente quando há muitos registros. Ele apresenta as informações no mesmo formato da tela do sistema, com as vigências exibidas lado a lado para facilitar a comparação. Também permite filtrar os dados por período de vigência, situação, matrícula, tipo de matrícula e outros critérios, tornando as consultas mais rápidas e práticas." },
            { system: "rh", type: "relatorio", title: "Movimentação do histórico de convocação", date: "2026-06-18", fonte: "bcbbb093-9b67-4378-a57d-0ade59301d9c", relatorio: "8fadbaec-7666-42ce-b99b-327e070de1b4", description: "Demonstra a movimentação do candidato na tela de convocação." },
            { system: "folha", type: "consulta", title: "Gerar informações da matrícula para conferir no SIOPE", key: "e58824ec-72cd-4404-b62f-f4de3d461fb6", date: "2026-06-18", description: "Lista remunerações de tipo FUNCIONARIO com base de cálculo do INSS, salário base, carga horária, cargo e campos adicionais." },
            { system: "folha", type: "alteracao", title: "Exclusão de Dependentes sem CPF", key: "769889b3-13d7-4791-80b2-e96d7c2e4a22", date: "2026-06-17", description: "Remove dependentes sem CPF via DELETE /dependencia/ (operacao REMOVER) + lote. Filtro opcional por pessoa sem pessoa selecionada, percorre TODAS as pessoas." },
            { system: "folha", type: "consulta", title: "Dependentes sem CPF - Matrículas Ativas", key: "c40dc00f-32ff-41b2-b6e1-9b533c0feab4", date: "2026-06-17", description: "Lista dependentes sem CPF (pessoa específica ou todas) e gera CSV. Apenas leitura — não altera nada." },
            { system: "folha", type: "relatorio", title: "Pessoa Física/Matrículas/Eventos Folha X eSocial cloud", date: "2026-06-15", fonte: "e6cdeacf-e769-4667-b473-379c4b3bcef1", relatorio: "6a393db7-6247-4b8a-a75f-03b8ec3442dd", description: "Demonstra inconsistências de campos obrigatórios no eSocial" },
            { system: "folha", type: "alteracao", title: "Altera Incidência PIS/PASEP", key: "29e6b299-e045-405e-887a-75366aa160f0", date: "2026-06-11", description: "Preencher os dados de incidência do PIS de acordo com os dados de INSS" },
            { system: "rh", type: "relatorio", title: "Gestão de recrutamento e seleção - Concuso/Processo", date: "2026-06-11", fonte: "fee47565-0e6b-443c-9237-02b4aba0e0a3", relatorio: "23fbda4c-8349-4536-b4a2-509e5da9704b", description: "Emissão dos dados da tela de gestão de recrutamento" },
            { system: "folha", type: "consulta", title: "Conferência Eventos do Folha X eSocial Enviados com Sucesso", key: "92293ef3-8bd2-4822-bad1-326e9973ea29", date: "2026-06-10", description: "Comparativo das incidências do último histórico da Folha com o ultimo evento enviado com sucesso para o Esocial" },
            { system: "folha", type: "consulta", title: "Consultar eventos em folha de pagamento - DIRF", key: "e1989e03-237c-404c-a3d7-1dd1cf5309c4", date: "2026-06-05", description: "Exibe o valor de um ou mais eventos mês a mês durante o ano inteiro. Gera CSV com detalhe por matrícula e resumo mensal + total geral." },
            { system: "folha", type: "consulta", title: "Verificar valor de plano de saúde por ano - DIRF", key: "4bdc337b-6e86-4147-b664-3e106f150dd5", date: "2026-06-05", description: "Lista despesas de plano de saúde do ano completo com filtro opcional por pessoa, saída em CSV." },
            { system: "esocial", type: "delete", title: "Excluir_Históricos_Domínios", key: "a321efa8-4b08-4b41-9b99-2cbc57840de8", date: "2026-06-02", description: "Excluir domínios. Para casos onde não é necessário enviar folha de remuneração ou pagamento." },
            { system: "folha", type: "consulta", title: "Conferência Despesas RH x Cálculo Folha", key: "f82638ef-bb74-484e-926c-8a4ea454f62c", date: "2026-05-27", description: "Realiza o De Para das despesas do plano de saúde importadas no RH, com os eventos de despesas calculados em folha. Exporta um CSV ao final de sua execução." },
            { system: "folha", type: "alteracao", title: "Alterar Número reservista - Com parâmetro por admissão", key: "3dc2cc8d-11f3-4906-be76-2453406fe0b8", date: "2026-05-27", description: "Altera o número do certificado de reservista no cadastro de pessoas. Com parâmetro por admissão." },
            { system: "rh", type: "consulta", title: "Auditoria de Licença Prêmio sem Avarbação", key: "d1af4b2d-e0a9-40db-95ac-f525bb83c0e3", date: "2026-05-26", description: "O script identifica períodos de licença prêmio de servidores ativos onde o campo 'averbacao' dentro do array 'composicoes' está nulo." },
            { system: "rh", type: "alteracao", title: "[Plano de Saúde - SÃO JOSÉ] Cadastrando plano de saúde através do arquivo de importação padrão", key: "d12001da-2d4a-46c3-adc0-74b89d9f4f77", date: "2026-05-22", description: "Valida os dados dos registros do arquivo de importação do SÃO JOSÉ, validando tanto os titulares quanto os dependentes. Caso o registro lido no arquivo não existir como um benefício no sistema, este será automaticamente cadastrado durante a execução do script, caso não for possível este será retornado em um planilha CSV para cadastro manual. Lembrando que este script é exclusivo para o layout do SÃO JOSÉ." },
            { system: "rh", type: "alteracao", title: "[PLANO SÃO JOSÉ] Importação de despesas de planos de saúde", key: "754199f9-5429-4bc1-af44-4f7fd5f10bd3", date: "2026-05-22", description: "Realiza a importação das despesas do plano de saúde oriundos do SÃO JOSÉ. Lembrando que o layout do SÃO JOSÉ é diferente da UNIMED, sendo necessário scripts diferentes para a importação." },
            { system: "rh", type: "consulta", title: "Procura matriculas vinculadas a um concurso/processo seletivo", key: "5e7dbafb-4ce5-49cd-b090-3d56b537e1b0", date: "2026-05-21", description: "Busca todas as matriculas que estão com esse concurso/processo seletivo vinculados." },

        : `${newCount} atualização(ões) recente(s) nos últimos 10 dias`
    }
</span>
`;

    document.getElementById("toggle-new").onclick = toggleNewFilter;

} else {
    notification.style.display = "none";
}

function toggleNewFilter() {

    if (showingOnlyNew) {
        showingOnlyNew = false;
        applyFilters(); // volta todos respeitando os filtros atuais
    } else {
        showingOnlyNew = true;

        const filtered = scripts.filter(s => isNew(s.date));
        renderScripts(filtered);
    }

}

        function applyFilters() {
            const searchText = document.getElementById("search").value.toLowerCase();
            const filterSystem = document.getElementById("filter-system").value;
            const filterType = document.getElementById("filter-type").value;

            const filtered = scripts.filter(s => {
                const matchSearch = [
    s.title,
    s.type,
    s.key,
    s.fonte,
    s.relatorio
]
    .filter(Boolean)
    .some(field => field.toLowerCase().includes(searchText));


                const matchSystem = filterSystem ? s.system === filterSystem : true;
                const matchType = filterType ? s.type === filterType : true;

                return matchSearch && matchSystem && matchType;
            });

            renderScripts(filtered);
        }

        document.getElementById("search").addEventListener("input", applyFilters);
        document.getElementById("filter-system").addEventListener("change", applyFilters);
        document.getElementById("filter-type").addEventListener("change", applyFilters);

        function toggleDescription(el) {
            const box = el.nextElementSibling;
            const open = box.style.display === "block";
            box.style.display = open ? "none" : "block";
            el.innerText = open ? "▼ Descrição" : "▲ Ocultar";
        }

        function copyKey(id, btn) {
            const text = document.getElementById(id).innerText;
            const temp = document.createElement("textarea");
            temp.value = text;
            temp.style.position = "fixed";
            temp.style.opacity = "0";
            document.body.appendChild(temp);

            temp.select();
            document.execCommand("copy");
            temp.remove();

            btn.innerText = "✔️ Copiado!";
            setTimeout(() => btn.innerText = "📝 Copiar", 1400);
        }
